name: Build Ghost Line APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'

      - name: Accept SDK licenses and ensure Android 36.1 platform
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" || true
          if [ ! -d "$SDK_PATH/platforms/android-36.1" ] && [ -d "$SDK_PATH/platforms/android-36" ]; then
            ln -s "$SDK_PATH/platforms/android-36" "$SDK_PATH/platforms/android-36.1"
          fi
          ls -la "$SDK_PATH/platforms"

      - name: Prepare debug keystore
        run: |
          if [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env exists
        run: touch .env

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Verify and sign APK (v1 + v2)
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK_PATH/build-tools/36.0.0/apksigner"
          cp app/build/outputs/apk/debug/app-debug.apk GhostLine.apk
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            GhostLine.apk
          "$APKSIGNER" verify --min-sdk-version 21 GhostLine.apk
          ls -lh GhostLine.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-line-debug-apk
          path: GhostLine.apk

      - name: Publish direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest GhostLine.apk --clobber
          else
            gh release create latest GhostLine.apk \
              --target "${{ github.sha }}" \
              --title "Ghost Line APK (Android 6.0+)" \
              --notes "Build automatique Ghost Line (Android 6.0+)" \
              --latest
          fi
